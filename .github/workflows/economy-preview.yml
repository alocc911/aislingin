name: Economy branch test and browser preview
on:
  push:
    branches: [economy-persistent-gold-paid-buildings-2026-10-22, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify engine and import resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --version
          VERSION=4.7.2.stable
          TARGET="$HOME/.local/share/godot/export_templates/$VERSION"
          SOURCE="/root/.local/share/godot/export_templates/$VERSION"
          if [ ! -d "$TARGET" ]; then
            mkdir -p "$(dirname "$TARGET")"
            cp -a "$SOURCE" "$TARGET"
          fi
          test -s "$TARGET/web_nothreads_release.zip"
          godot --headless --path . --editor --import
      - name: Parse-check changed game scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s godot --headless --path . --check-only --script res://scripts/ProvinceSystem.gd
      - name: Check Phase 2 scripts and shared-water regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --check-only --script res://scripts/WaterAreaRegistry.gd
          godot --headless --path . --check-only --script res://scripts/PerformanceDiagnostics.gd
          godot --headless --path . --check-only --script res://scripts/Runner.gd
          godot --headless --path . --check-only --script res://scripts/Chief.gd
          timeout 25s godot --headless --path . --script res://scripts/Phase2RegressionRunner.gd 2>&1 | tee phase2-regression.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' phase2-regression.log; then
            echo "Unexpected GDScript errors in Phase 2 regression suite."
            exit 1
          fi
          grep -q '"ok":true' phase2-regression.log
      - name: Run province economy regression tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 25s godot --headless --path . --script res://scripts/EconomyRegressionRunner.gd 2>&1 | tee economy-regression.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' economy-regression.log; then
            echo "Unexpected Godot script errors in regression suite."
            exit 1
          fi
      - name: Verify full-troop conquest and Europe-inspired seeded geography
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s godot --headless --path . --script res://scripts/ConquestAndGeographySelfTest.gd 2>&1 | tee conquest-geography.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' conquest-geography.log; then
            echo "Unexpected Godot script errors in conquest/geography regression."
            exit 1
          fi
          grep -F '"ok":true' conquest-geography.log
      - name: Run 100-turn economy simulations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p economy-results
          timeout 180s godot --headless --path . --script res://scripts/EconomySimulationRunner.gd -- --output-dir "$GITHUB_WORKSPACE/economy-results" 2>&1 | tee economy-simulation.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' economy-simulation.log; then
            echo "Unexpected Godot script errors in economic simulation."
            exit 1
          fi
          test -s economy-results/economy_100_turn_summary.json
          test -s economy-results/economy_100_turn_timeseries.csv
      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: sunnyslopes-economy-100-turn-results
          path: economy-results/
          if-no-files-found: error
          retention-days: 30
      - name: Simulate seeded no-player campaigns and boss competition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p autoplay-results
          timeout 300s godot --headless --path . --script res://scripts/AutoplayCampaignRunner.gd -- --seeds 1 --turns 30 --first-seed 71 --boss-turn 10 --output-dir "$GITHUB_WORKSPACE/autoplay-results" 2>&1 | tee autoplay-campaign.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' autoplay-campaign.log; then
            echo "Godot reported script errors during autoplay campaign."
            exit 1
          fi
          grep -q 'AUTOPLAY_COMPLETE' autoplay-campaign.log
          test -s autoplay-results/autoplay_summary.json
          test -s autoplay-results/autoplay_timeseries.csv
      - name: Upload no-player campaign results
        uses: actions/upload-artifact@v4
        with:
          name: sunnyslopes-autoplay-campaign-results
          path: autoplay-results/
          if-no-files-found: error
          retention-days: 30
      - name: Export preview build (without publishing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-preview
          godot --headless --path . --export-release "Web" "$GITHUB_WORKSPACE/web-preview/index.html" 2>&1 | tee web-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script' web-export.log; then
            echo "Godot reported script errors during Web export."
            exit 1
          fi
          test -s web-preview/index.html
          test -s web-preview/index.js
          test -s web-preview/index.pck
          test -s web-preview/index.wasm
          printf 'Branch: %s\nCommit: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > web-preview/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sunnyslopes-browser-build
          path: web-preview/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
